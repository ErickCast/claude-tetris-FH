<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="theme-toggle">
    <label class="switch">
      <input type="checkbox" id="theme-switch" aria-label="Cambiar a modo claro" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div id="screen-start" class="screen hidden">
        <p class="screen-title">TETRIS</p>
        <div id="records-slot"></div>
        <div id="skin-slot"></div>
        <button id="play-btn" class="menu-btn">JUGAR</button>
      </div>

      <div id="screen-pause" class="screen hidden">
        <p class="screen-title">PAUSA</p>

        <div id="pause-main-view" class="pause-subview">
          <ul class="menu-list" id="pause-main-menu">
            <li class="pause-item" data-item="resume">
              <button type="button" class="menu-btn pause-btn" id="pause-resume-btn">Reanudar</button>
            </li>
            <li class="pause-item" data-item="restart">
              <button type="button" class="menu-btn pause-btn" id="pause-restart-btn">Reiniciar</button>
            </li>
            <li class="pause-item" data-item="controls">
              <button type="button" class="menu-btn pause-btn" id="pause-controls-btn">Ver controles</button>
            </li>
            <li class="pause-item" data-item="level">
              <div class="level-picker">
                <span class="pause-item-label">Nivel inicial</span>
                <div class="level-stepper">
                  <button type="button" class="stepper-btn" id="pause-level-dec" aria-label="Disminuir nivel inicial">−</button>
                  <span class="level-value" id="pause-level-value">1</span>
                  <button type="button" class="stepper-btn" id="pause-level-inc" aria-label="Aumentar nivel inicial">+</button>
                </div>
              </div>
              <span class="pause-item-hint">Se aplica en la próxima partida</span>
            </li>
          </ul>
        </div>

        <div id="pause-controls-view" class="pause-subview hidden">
          <ul class="controls-list">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
          <button type="button" class="menu-btn pause-btn" id="pause-controls-back-btn">Volver</button>
        </div>
      </div>

      <div id="screen-gameover" class="screen hidden">
        <p id="overlay-title" class="screen-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="records-slot-gameover"></div>
        <button id="restart-btn" class="menu-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
